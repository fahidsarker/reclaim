name: go
description: Go modules
priority: 10

detect:
  file_exists: go.mod

targets:
  - path: vendor
    reason: Go vendored dependencies
    regenerate: go mod vendor
    safety: requires_flag
  - path: bin
    reason: Go local binaries
    regenerate: go build
  - path: dist
    reason: Go distribution output
    regenerate: go build
