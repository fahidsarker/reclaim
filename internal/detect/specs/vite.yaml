name: vite
description: Vite projects
priority: 15

detect:
  any:
    - file_exists: vite.config.js
    - file_exists: vite.config.ts
    - file_exists: vite.config.mjs
    - file_exists: vite.config.cjs

targets:
  - path: dist
    reason: Vite build output
    regenerate: vite build
  - path: node_modules/.vite
    reason: Vite dependency pre-bundle cache
    regenerate: vite
